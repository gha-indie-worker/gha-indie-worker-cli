    [package]
    name = "gha-indie-worker-cli"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "CLI for GHA Indie Worker"
    repository = "https://github.com/gha-indie-worker/gha-indie-worker-cli"

    [[bin]]
    name = "ghaiw"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


