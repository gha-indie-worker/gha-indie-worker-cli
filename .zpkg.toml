[package]
org = "gha-indie-worker"
name = "gha-indie-worker-cli"
version = "0.1.0"
description = "CLI for the GHA Indie Worker control plane"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/gha-indie-worker/gha-indie-worker-cli"

[dependencies]
"oresoftware/ores-clis-core" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin giw"
outputs = ["target/release/giw"]

[bin]
giw = "target/release/giw"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/giw\" && \"$ZED_PKG_TEST_TARGET/target/release/giw\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
