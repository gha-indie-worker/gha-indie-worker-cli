name: refresh shared CLI lock

on:
  push:
    branches:
      - feat/shared-cli-runtime-v1
    paths:
      - .github/workflows/refresh-shared-cli-lock.yml

permissions:
  contents: write

env:
  ZED_CLI_REV: dbd63f1d87d12c2e8cb9a8c600fae9b79f94e559

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-cli-runtime-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Build audited Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --locked \
            --git https://github.com/zed-pkg/zed-cli.git \
            --rev "$ZED_CLI_REV" \
            --root "$RUNNER_TEMP/zed-cli" \
            --bin zed
          echo "$RUNNER_TEMP/zed-cli/bin" >> "$GITHUB_PATH"

      - name: Refresh Zed and Cargo locks and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zed-cli/bin/zed" validate
          "$RUNNER_TEMP/zed-cli/bin/zed" install --install-mode copy
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Commit generated locks and remove refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-shared-cli-lock.yml
          git add Cargo.lock .zpkg.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh locks for shared CLI runtime"
          git push origin HEAD:feat/shared-cli-runtime-v1
