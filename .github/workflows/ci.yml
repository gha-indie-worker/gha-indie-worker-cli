name: GHA Indie Worker CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-and-indiebuild:
    # PR verification is deferred to gha-indie-worker on indiebuild.dev. Keep
    # push CI intact, but skip before runner allocation for pull requests.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Verify committed Cargo lock
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust tests, including Zed package metadata contract
        run: cargo test --all-targets --locked

      - name: Rust Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate repository IndieBuild config through flags-2-env CLI
        run: cargo run --quiet --locked -- indiebuild-validate --json > /tmp/indiebuild.normalized.json

      - name: Check out exact merged IndieBuild authorities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gha-indie-worker/gha-indie-worker-interfaces
          ref: 634859430cba8b295c64a6b84c8ef814e0cb31a8
          path: .contracts
          persist-credentials: false

      - name: Check out immutable TJSV verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: a4b731fbf82c4d162abd74fd03758fa32bb76176
          path: .tjsv
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Audit TJSV production dependencies
        working-directory: .tjsv
        env:
          TSJSV_NPM_AUDIT_RECEIPT: ${{ runner.temp }}/tjsv-npm-audit-receipt.json
        run: node ./scripts/npm-audit-gate.mjs

      - name: Install TJSV lockfile-pinned toolchain
        working-directory: .tjsv
        run: npm ci --omit=dev

      - name: Re-admit independent IndieBuild authorities
        run: |
          set -euo pipefail
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=.contracts/contracts/indiebuild.tsp \
            --schema=.contracts/contracts/indiebuild.schema.json \
            --instances=.contracts/contracts/indiebuild-instances \
            --report=.typespec-json-schema-validator/indiebuild-report.json \
            --sarif=.typespec-json-schema-validator/indiebuild-report.sarif \
            --contract-ir=.typespec-json-schema-validator/indiebuild-contract-ir.json \
            --output-dir=.typespec-json-schema-validator/indiebuild-generated \
            --max-probes=64 \
            --int64-strategy=string \
            --seal-object-schemas=true \
            --polymorphic-models-strategy=oneOf

      - name: Verify current authority inputs before consumption
        env:
          TSJSV_VERIFY_IR: .typespec-json-schema-validator/indiebuild-contract-ir.json
          TSJSV_VERIFY_REPORT: .typespec-json-schema-validator/indiebuild-report.json
          TSJSV_VERIFY_TYPESPEC: .contracts/contracts/indiebuild.tsp
          TSJSV_VERIFY_AUTHORED: .contracts/contracts/indiebuild.schema.json
          TSJSV_VERIFY_GENERATED: .typespec-json-schema-validator/indiebuild-generated/typespec.generated.schema.json
          TSJSV_VERIFY_DECLARATIONS: '["GhaIndieWorker.IndieBuildRepositoryRole","GhaIndieWorker.IndieBuildTargetRole","GhaIndieWorker.IndieBuildPlatform","GhaIndieWorker.IndieBuildTarget","GhaIndieWorker.IndieBuildConfig"]'
          TSJSV_VERIFY_VERIFICATION: .typespec-json-schema-validator/indiebuild-consumer-verification.json
        run: node .tjsv/scripts/verify-consumer.mjs

      - name: Retain contract and lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-indie-worker-cli-indiebuild-evidence
          path: |
            Cargo.lock
            .typespec-json-schema-validator/
            /tmp/indiebuild.normalized.json
          if-no-files-found: error
          include-hidden-files: true
