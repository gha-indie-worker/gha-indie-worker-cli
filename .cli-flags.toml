[help]
url = "https://github.com/gha-indie-worker/gha-indie-worker-cli"

[parse]
allow_unknown = false

[flags.api-base]
env = "GHA_INDIE_WORKER_API_BASE"
aliases = ["api-base"]
type = "string"
default = "http://127.0.0.1:8080"
help = "API HTTP base URL."

[flags.json]
env = "GHA_INDIE_WORKER_JSON"
aliases = ["json"]
type = "boolean"
default = false
help = "Emit JSON."

[flags.indiebuild-config]
env = "INDIEBUILD_CONFIG"
aliases = ["indiebuild-config"]
type = "string"
default = ".indiebuild.toml"
help = "Path to the repository IndieBuild TOML contract."

[commands.health]
help = "Check API health."

[commands.status]
help = "Show service status."

[commands.indiebuild-validate]
help = "Validate repository-root .indiebuild.toml and print the normalized contract."

[flags.env-map-probe]
env = "ENV_MAP_PROBE"
long = "env-map-probe"
type = "string"
help = "Runtime environment key ENV_MAP_PROBE."
